name: Deploy to Cloudflare

on:
  push:
    # This repo was initialised on `master`; GitHub's default is `main`.
    # Listening to both means the workflow fires either way, including after
    # a rename.
    branches: [main, master]
  workflow_dispatch:

# The site is published by Wrangler now, so none of the Pages permissions
# apply. Reading the code is all this needs; the Cloudflare credential is a
# repository secret rather than a minted token.
permissions:
  contents: read

# Never let two deploys race. In-progress runs are cancelled rather than
# queued, because only the newest build is worth publishing.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails loudly
      # if the lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # `npm run build` is `tsc --noEmit && vite build`, so a type error blocks
      # the deploy instead of shipping a broken bundle.
      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run fixtures && npm run smoke

      # Wrangler re-runs the build through `build.command` in wrangler.jsonc,
      # so what it uploads is regenerated from the same source the smoke suite
      # just checked. The deploy carries the site and the API together.
      - name: Deploy Worker and site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
