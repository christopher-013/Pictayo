name: Verify

# Deploying is Cloudflare's job: it builds this repository from Git and
# publishes the Worker together with the site. This workflow is the gate in
# front of that — it runs the same checks a release depends on, so a
# regression is visible on the commit rather than after it is live.
on:
  push:
    # This repo was initialised on `master`; GitHub's default is `main`.
    # Listening to both means the workflow fires either way, including after
    # a rename.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails loudly
      # if the lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # `npm run build` is `tsc --noEmit && vite build`, so a type error fails
      # here rather than reaching Cloudflare's build.
      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run fixtures && npm run smoke

      # Asks Bing, Yandex, Seznam and Naver to re-crawl. Only on a real push to
      # the deploy branch, never on a pull request, and never allowed to fail a
      # run: search engines are told about the release, they do not gate it.
      - name: Ping IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        # Optional. Unset, the step still runs and IndexNow alone reaches Bing;
        # the secret only adds the more direct submission. Passed as an
        # environment variable rather than an argument so it stays out of the
        # command line the runner prints.
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: npm run indexnow
